{% extends "base.html" %}

{% block content %}

<div class="card">
    <h2>Upload Image for Analysis</h2>

    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <br><br>
        <button type="submit">Analyze</button>
    </form>
</div>

{% endblock %}
